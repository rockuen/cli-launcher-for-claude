name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # Pinned to windows-2022 (VS2022). The windows-latest image rolled to
          # windows-2025-vs2026 (2026-06), which ships only VS2026 — @electron/node-gyp
          # can't detect it yet, so the node-pty rebuild fails with
          # "Could not find any Visual Studio installation". Revert to windows-latest
          # once node-gyp gains VS2026 support.
          - os: windows-2022
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Rebuild node-pty for Electron 39.2.3
        run: npx @electron/rebuild -v 39.2.3 -m .
      - run: npx @vscode/vsce package --target ${{ matrix.target }} --no-git-tag-version --allow-missing-repository
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g ovsx
      - name: Publish to Open VSX
        # Idempotent + transient-resilient publish loop. Failure classes are
        # handled distinctly:
        #   - "is already published" (and active) — a soft skip. Lets a retry
        #     of a partially-published tag (e.g. darwin-arm64 succeeded,
        #     win32-x64 didn't) re-run cleanly without aborting on the first
        #     artifact.
        #   - "is already published, but currently isn't active" — a
        #     half-registered zombie left by an interrupted publish. This is
        #     NOT a safe skip: the artifact is invisible to users and ovsx
        #     can't overwrite the same version. Surface it as an error so the
        #     run goes red and a version bump is done deliberately.
        #   - transient server/network errors (HTTP 5xx, ECONNRESET,
        #     ETIMEDOUT, socket hang up) — retried up to 3× with a linear
        #     backoff. Open VSX returns sporadic 503s, more likely on the
        #     larger win32-x64 artifact.
        # Anything else is a real failure and fails the job.
        run: |
          set +e
          overall=0
          MAX_ATTEMPTS=3
          for f in *.vsix; do
            echo "::group::Publishing $f"
            attempt=1
            while true; do
              output=$(ovsx publish "$f" -p ${{ secrets.OVSX_TOKEN }} 2>&1)
              rc=$?
              echo "$output"
              if [ $rc -eq 0 ]; then
                break
              fi
              if echo "$output" | grep -q "is already published"; then
                if echo "$output" | grep -qE "isn't active|not visible"; then
                  echo "::error::$f is half-published on Open VSX (inactive / not visible) — a previous publish was interrupted. Bump the version to recover; ovsx cannot overwrite or reactivate the same version."
                  overall=1
                  break
                fi
                echo "::notice::$f already on Open VSX — skipping (partial-publish recovery)"
                break
              fi
              if echo "$output" | grep -qE "status 5[0-9][0-9]|ECONNRESET|ETIMEDOUT|socket hang up|EAI_AGAIN"; then
                if [ $attempt -lt $MAX_ATTEMPTS ]; then
                  wait=$((attempt * 20))
                  echo "::warning::$f transient failure (attempt $attempt/$MAX_ATTEMPTS) — retrying in ${wait}s"
                  sleep $wait
                  attempt=$((attempt + 1))
                  continue
                fi
                echo "::error::$f still failing after $MAX_ATTEMPTS attempts (last error transient)"
                overall=1
                break
              fi
              echo "::error::$f failed to publish (exit $rc)"
              overall=1
              break
            done
            echo "::endgroup::"
          done
          exit $overall
